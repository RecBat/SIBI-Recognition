<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIBI Recognition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h2 class="text-center fw-bold">SIBI Alphabet Recognition</h2>

        <ul class="nav nav-tabs justify-content-center mb-4">
            <li class="nav-item">
                <a href="#" class="nav-link active" id="tab-detect" onclick="switchTab('detect'); return false;">
                    Gesture to Text
                </a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link" id="tab-translate" onclick="switchTab('translate'); return false;">
                    Text to Gesture
                </a>
            </li>
        </ul>
        
        <div id="panel-detect">
            <div class="row justify-content-center">
                <div class="col-md-6 text-center">
                    <video id="videoEl" autoplay playsinline></video>
                    <canvas id="canvas" style="display:none"></canvas>
                </div>

                <div class="col-md-5">
                    <div class="card-result">
                        <p class="model-tag mb-1"> K-Nearest Neighbor</p>
                        <div class="label-big knn-color" id="knn-label">-</div>
                        <div class="mt-2">
                            <span class="badge bg-primary" id="knn-conf">-</span>
                            <span class="badge bg-secondary ms-1" id="knn-time">-</span>
                        </div>
                    </div>

                    <div class="card-result">
                        <p class="model-tag mb-1"> Random Forest</p>
                        <div class="label-big rf-color" id="rf-label">-</div>
                        <div class="mt-2">
                            <span class="badge bg-primary" id="rf-conf">-</span>
                            <span class="badge bg-secondary ms-1" id="rf-time">-</span>
                        </div>
                    </div>

                    <div class="card-result">
                        <p class="model-tag mb-1"> Ensemble Voting</p>
                        <div class="label-big ens-color" id="ens-label">-</div>
                        <div class="mt-2">
                            <span class="badge bg-primary" id="ens-conf">-</span>
                            <span class="badge bg-secondary ms-1" id="ens-time">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="panel-translate" style="display:none">
            <div class="text-center mb-4">
                <input type="text" id="wordInput" class="form-control word-input"
                    placeholder="Enter Letters or Sentences">
                <button onclick="showGestures()" class="btn btn-primary mt-2">
                    Show Gesture
                </button>
            </div>
            <div id="gestureDisplay" class="d-flex flex-wrap gap-3 justify-content-center"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
